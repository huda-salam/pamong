# config/default.yaml — nilai default aman, di-commit ke repo.
# Lapis paling rendah; ditimpa oleh config/{env}.yaml, config/local.yaml, lalu env GOV_*.
# JANGAN taruh kredensial nyata di sini — gunakan config/local.yaml (tidak di-commit)
# atau environment variable.

env: development

# db: DEFAULT/SHARED koneksi tenant DB (ADR-004). Host & nama DB per-tenant berasal
# dari id.tenant_registry saat runtime; di sini hanya kredensial+pool bersama + host
# default Tier 1. `name` cuma fallback single-tenant/dev.
db:
  host: localhost
  port: 5432
  name: pamong
  user: pamong
  password: ""
  pool_max: 25
  pool_idle: 5

# identity_db: koneksi PENUH ke identity DB sentral (registry tenant hidup di sini).
identity_db:
  host: localhost
  port: 5432
  name: gov_identity
  user: pamong
  password: ""
  pool_max: 10
  pool_idle: 2

# central_db: DB sentral data master/referensi shared (entity ResidencyCentral, ADR-005).
# Biarkan host kosong = jatuh ke identity DB (default; tanpa infra baru). Isi hanya bila
# data referensi dipisah ke instance gov_central tersendiri.
central_db:
  host: ""
  port: 5432
  name: gov_central
  user: ""
  password: ""
  pool_max: 10
  pool_idle: 2

# provision_db: kredensial ADMIN (ber-CREATEDB) untuk provisioning tenant DB (ADR-006).
# TERPISAH dari `db` (runtime, least-privilege). Kosong = provisioning tidak tersedia
# sampai diisi via env/local. `maintenance` = DB tempat connect saat CREATE DATABASE.
provision_db:
  user: ""
  password: ""
  maintenance: postgres

eventbus:
  # memory = HANYA development (dispatch sinkron, tanpa durability/retry, error subscriber
  # mengalir balik ke pemanggil Publish). Ditolak Validate() di staging & production — isi
  # driver: nats + url di {env}.yaml atau GOV_EVENTBUS_DRIVER/GOV_EVENTBUS_URL.
  driver: memory
  url: ""
  stream: pamong

storage:
  driver: local
  endpoint: ""
  bucket: pamong
  access_key: ""
  secret_key: ""

# messaging: pengiriman SMS/email keluar (OTP & notifikasi). Driver "log" (dev) mencatat
# pesan ke log & selalu sukses — DILARANG di production (pakai smtp/provider nyata di sana).
messaging:
  driver: log
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  smtp_password: ""
  from_email: no-reply@pamong.local

# crypto: enkripsi field selektif (ADR-009) + key management (ADR-010).
# kms_driver SENGAJA kosong di sini. Kosong = "belum dipilih": deployment yang belum
# memakai kripto tetap bisa boot, dan penolakan terjadi di titik PEMAKAIAN
# (crypto.NewFromConfig) — bukan memaksa semua staging/production menyediakan kunci
# sebelum ada satu pun kolom terenkripsi. Di development, kosong diperlakukan "local".
#   local  = dev/test (kunci turunan tetap, ada di source code) — DITOLAK di luar development.
#   static = produksi Tier 1/2; set GOV_CRYPTO_MASTER_KEY (base64 32-byte) dari secret
#            store — JANGAN taruh master key di file ini.
# Custody (siapa pegang KEK) bukan di sini: kebijakan per-tenant di
# id.tenant_registry.key_custody.
crypto:
  kms_driver: ""
  kms_endpoint: ""
  master_key: ""
  master_key_v2: ""
  dek_cache_ttl: 5m

cache:
  driver: memory
  url: ""
  ttl_default: 300

observability:
  otel_endpoint: ""
  metrics_enabled: false
  tracing_enabled: false
  log_level: info
  log_format: text

auth:
  # Token INTERNAL (diterbitkan & diverifikasi Pamong sendiri, HS256; ADR-007).
  # token_secret: kunci HMAC. JANGAN commit nilai nyata — set di config/local.yaml atau env
  # GOV_AUTH_TOKEN_SECRET. Wajib & ≥32 karakter di production (divalidasi saat boot).
  token_secret: ""
  token_ttl: 3600        # umur token internal (detik); 0 = default 1 jam
  # token_max_bytes: pagar ukuran token terbit (ADR-020). Token yang melewatinya DITOLAK saat
  # login — bukan diterbitkan lalu ditolak proxy (login 200 lalu semua request 400 tanpa jejak
  # di log aplikasi). 0 = default aman 6144 byte, DI BAWAH batas header nginx 8 KiB; naikkan
  # bila proxy di depan memang lebih longgar (ALB 16 KiB). Tak ada nilai yang mematikan pagar:
  # <1024 dan >65536 ditolak saat boot (yang kedua karena ambang ini juga menurunkan
  # MaxHeaderBytes). Nilai efektif yang berlaku ikut di-log saat boot — periksa di sana bila
  # setelan terasa tak berpengaruh.
  token_max_bytes: 0
  # Token SSO EKSTERNAL (verifikasi token dari IdP lain) — dipakai PR auth eksternal.
  jwks_url: ""
  issuer: ""
  audience: pamong

ratelimit:
  enabled: false
  rps: 100
  burst: 20

# http: server gateway (PR-5.1.1). addr = alamat listen.
http:
  addr: ":8080"

# permission: penegakan RBAC di gateway (PR-5.1.2c).
# catalog_ttl = umur cache snapshot catalog role tenant di evaluator factory (detik).
# Setelah lewat, catalog dibangun ulang dari tenant DB → perubahan DEFINISI role tenant
# (permission sebuah nama role) terlihat tanpa restart (jeda ≤ TTL). CATATAN: ini TIDAK
# menyegarkan role yang dipegang user atau penonaktifan user — itu dibawa klaim token
# (berlaku lewat masa token / revocation). 0 = default 300s; negatif = tak pernah kedaluwarsa.
permission:
  catalog_ttl: 300
